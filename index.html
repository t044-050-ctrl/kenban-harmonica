    <script>
        /* -------------------------------------------------------------
           WEB AUDIO API SYNTHESIZER FOR MELODICA (REED SOUND)
           ------------------------------------------------------------- */
        class MelodicaAudioEngine {
            constructor() {
                this.ctx = null;
                this.activeNotes = new Map(); // midi -> { osc1, osc2, gain, filter }
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            midiToFreq(midi) {
                return 440 * Math.pow(2, (midi - 69) / 12);
            }

            startNote(midi) {
                this.init();
                if (this.activeNotes.has(midi)) return;

                const freq = this.midiToFreq(midi);
                const now = this.ctx.currentTime;

                // Reed timbre synthesis: saw + square wave detune
                const osc1 = this.ctx.createOscillator();
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(freq, now);

                const osc2 = this.ctx.createOscillator();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(freq * 1.002, now);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(freq * 3.5, now);
                filter.Q.setValueAtTime(1.5, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.02);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);

                this.activeNotes.set(midi, { osc1, osc2, gain, filter });
            }

            stopNote(midi) {
                if (!this.ctx || !this.activeNotes.has(midi)) return;

                const note = this.activeNotes.get(midi);
                const now = this.ctx.currentTime;

                note.gain.gain.cancelScheduledValues(now);
                note.gain.gain.setValueAtTime(note.gain.gain.value, now);
                note.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);

                setTimeout(() => {
                    try {
                        note.osc1.stop();
                        note.osc2.stop();
                        note.osc1.disconnect();
                        note.osc2.disconnect();
                        note.gain.disconnect();
                    } catch (e) {}
                }, 50);

                this.activeNotes.delete(midi);
            }
        }

        const audioEngine = new MelodicaAudioEngine();

        const unlockAudioContext = () => {
            audioEngine.init();

        window.addEventListener('touchstart', unlockAudioContext, { capture: true });
        window.addEventListener('mousedown', unlockAudioContext, { capture: true });

        const activePointerMidis = new Map();

        /* -------------------------------------------------------------
           TOUCH / POINTER STATE SYNC
           ------------------------------------------------------------- */
        function syncKeyStates() {
            const targetMidis = new Set([...activePointerMidis.values(), ...pcPressedMidis]);

            for (const midi of Array.from(activePressedMidis)) {
                if (!targetMidis.has(midi)) {
                    releaseKey(midi);
                }
            }

            targetMidis.forEach(midi => {
                if (!activePressedMidis.has(midi)) {
                    pressKey(midi);
                }
            });
        }

        function stopAllNotes() {
            activePointerMidis.clear();
            pcPressedMidis.clear();
            syncKeyStates();
        }

        /* -------------------------------------------------------------
           UI DOM GENERATION & REAL DIMENSION RENDERING
           ------------------------------------------------------------- */
        function renderKeyboard() {
            const container = document.getElementById('keyboard-container');
            const wrapper = document.getElementById('keyboard-wrapper');
            if (!container || !wrapper) return;
            container.innerHTML = '';

            const whiteKeys = KEYS_CONFIG.filter(k => !k.isBlack);
            const totalWhiteKeys = whiteKeys.length; // 19

            if (isRealMmScale) {
                // Chromebook画面上で実寸19mmになるようスケール調整
                wrapper.className = 'w-full relative overflow-x-auto flex items-end pb-1';
                container.style.width = `${19 * 26.6}mm`;
                container.style.height = `118mm`;
                
                const whiteKeyWidthMm = 26.6;  // 実測約19mm表示
                const whiteKeyHeightMm = 113.0; // 白鍵長さ
                const blackKeyWidthMm = 13.9;   // 黒鍵幅（実測約10mm表示）
                const blackKeyHeightMm = 66.7;  // 黒鍵長さ

                whiteKeys.forEach(key => {
                    const keyEl = document.createElement('div');
                    keyEl.id = `key-${key.midi}`;
                    keyEl.dataset.midi = key.midi;
                    keyEl.className = 'white-key absolute bottom-0 flex flex-col justify-end items-center pb-2 cursor-pointer select-none';
                    keyEl.style.width = `${whiteKeyWidthMm - 0.4}mm`;
                    keyEl.style.height = `${whiteKeyHeightMm}mm`;
                    keyEl.style.left = `${key.whitePos * whiteKeyWidthMm + 0.2}mm`;

                    const label = document.createElement('span');
                    label.className = 'key-label text-[11px] font-black text-slate-700 pointer-events-none select-none';
                    label.innerText = getLabelText(key);
                    keyEl.appendChild(label);

                    container.appendChild(keyEl);
                });

                KEYS_CONFIG.filter(k => k.isBlack).forEach(key => {
                    const keyEl = document.createElement('div');
                    keyEl.id = `key-${key.midi}`;
                    keyEl.dataset.midi = key.midi;
                    keyEl.className = 'black-key absolute flex flex-col justify-end items-center pb-1.5 cursor-pointer select-none top-0';
                    keyEl.style.width = `${blackKeyWidthMm}mm`;
                    keyEl.style.height = `${blackKeyHeightMm}mm`;
                    const leftMm = (key.whitePos + 1) * whiteKeyWidthMm - (blackKeyWidthMm / 2);
                    keyEl.style.left = `${leftMm}mm`;

                    const label = document.createElement('span');
                    label.className = 'key-label text-[9px] font-bold text-slate-200 pointer-events-none select-none';
                    label.innerText = getLabelText(key);
                    keyEl.appendChild(label);

                    container.appendChild(keyEl);
                });

                // 初期スクロール位置を白鍵2つ分左へ移動
                requestAnimationFrame(() => {
                    const key2El = document.getElementById('key-57'); // whitePos 2 (A3)
                    if (key2El) {
                        wrapper.scrollLeft = key2El.offsetLeft;
                    }
                });

            } else {
                // Screen-Fit Mode with EXACT Real Melodica Physical Aspect Ratio (1 : 4.25)
                wrapper.className = 'w-full relative overflow-hidden flex flex-col justify-end';
                container.style.width = '100%';

                const containerWidth = container.clientWidth || wrapper.clientWidth || 800;
                const singleWhiteWidth = containerWidth / totalWhiteKeys;
                
                const whiteKeyHeight = singleWhiteWidth * 4.25;
                const blackKeyHeight = whiteKeyHeight * 0.59;
                const blackKeyWidth = singleWhiteWidth * 0.55;

                container.style.height = `${whiteKeyHeight + 6}px`;

                whiteKeys.forEach(key => {
                    const keyEl = document.createElement('div');
                    keyEl.id = `key-${key.midi}`;
                    keyEl.dataset.midi = key.midi;
                    keyEl.className = 'white-key absolute bottom-0 flex flex-col justify-end items-center pb-2 cursor-pointer select-none';
                    keyEl.style.width = `${singleWhiteWidth - 2}px`;
                    keyEl.style.height = `${whiteKeyHeight}px`;
                    keyEl.style.left = `${key.whitePos * singleWhiteWidth + 1}px`;

                    const label = document.createElement('span');
                    label.className = 'key-label text-[11px] md:text-xs font-black text-slate-700 pointer-events-none select-none';
                    label.innerText = getLabelText(key);
                    keyEl.appendChild(label);

                    container.appendChild(keyEl);
                });

                KEYS_CONFIG.filter(k => k.isBlack).forEach(key => {
                    const keyEl = document.createElement('div');
                    keyEl.id = `key-${key.midi}`;
                    keyEl.dataset.midi = key.midi;
                    keyEl.className = 'black-key absolute flex flex-col justify-end items-center pb-1.5 cursor-pointer select-none top-0';
                    keyEl.style.width = `${blackKeyWidth}px`;
                    keyEl.style.height = `${blackKeyHeight}px`;
                    const leftPx = (key.whitePos + 1) * singleWhiteWidth - (blackKeyWidth / 2);
                    keyEl.style.left = `${leftPx}px`;

                    const label = document.createElement('span');
                    label.className = 'key-label text-[9px] md:text-[10px] font-bold text-slate-200 pointer-events-none select-none';
                    label.innerText = getLabelText(key);
                    keyEl.appendChild(label);

                    container.appendChild(keyEl);
                });
            }

            setupPointerListeners(container);
        }

        function setScaleMode(isMm) {
            isRealMmScale = isMm;
            document.getElementById('btn-scale-fit').className = !isMm ? 'px-2 py-1 rounded font-bold bg-emerald-500 text-white shadow' : 'px-2 py-1 rounded font-bold hover:bg-slate-600 text-slate-300';
            document.getElementById('btn-scale-mm').className = isMm ? 'px-2 py-1 rounded font-bold bg-emerald-500 text-white shadow' : 'px-2 py-1 rounded font-bold hover:bg-slate-600 text-slate-300';
            renderKeyboard();
        }

        function setupPointerListeners(container) {
            const updatePointerFromEvent = (e) => {
                const el = document.elementFromPoint(e.clientX, e.clientY);
                const keyEl = el ? el.closest('[data-midi]') : null;
                if (keyEl) {
                    const midi = parseInt(keyEl.dataset.midi, 10);
                    activePointerMidis.set(e.pointerId, midi);
                } else {
                    activePointerMidis.delete(e.pointerId);
                }
                syncKeyStates();
            };

            container.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                audioEngine.init();
                updatePointerFromEvent(e);
            });

            window.addEventListener('pointermove', (e) => {
                if (e.buttons > 0 || e.pointerType === 'touch') {
                    updatePointerFromEvent(e);
                }
            });

            const clearPointer = (e) => {
                if (activePointerMidis.has(e.pointerId)) {
                    activePointerMidis.delete(e.pointerId);
                    syncKeyStates();
                }
            };

            window.addEventListener('pointerup', clearPointer);
            window.addEventListener('pointercancel', clearPointer);
            window.addEventListener('pointerleave', clearPointer);
            window.addEventListener('blur', stopAllNotes);
        }

        function getLabelText(key) {
            if (labelMode === 'doremi') return key.doremi;
            return '';
        }

        /* -------------------------------------------------------------
           KEY PRESS / RELEASE ACTIONS
           ------------------------------------------------------------- */
        function pressKey(midi) {
            if (activePressedMidis.has(midi)) return;
            activePressedMidis.add(midi);

            const keyEl = document.getElementById(`key-${midi}`);
            if (keyEl) keyEl.classList.add('active');

            audioEngine.startNote(midi);
            createNoteParticle(midi);
            checkLessonProgress(midi);
        }

        function releaseKey(midi) {
            if (!activePressedMidis.has(midi)) return;
            activePressedMidis.delete(midi);

            const keyEl = document.getElementById(`key-${midi}`);
            if (keyEl) keyEl.classList.remove('active');

            audioEngine.stopNote(midi);
        }

        function createNoteParticle(midi) {
            const keyEl = document.getElementById(`key-${midi}`);
            if (!keyEl) return;

            const rect = keyEl.getBoundingClientRect();
            const particle = document.createElement('div');
            particle.className = 'note-particle text-amber-400 font-black text-sm drop-shadow-md';
            particle.innerText = '♪';
            particle.style.left = `${rect.left + rect.width / 2 - 8}px`;
            particle.style.top = `${rect.top - 10}px`;

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 800);
        }

        /* -------------------------------------------------------------
           LABEL & THEME CONTROLS
           ------------------------------------------------------------- */
        function setLabelMode(mode) {
            labelMode = mode;
            document.getElementById('btn-label-none').className = mode === 'none' ? 'px-2 py-1 rounded font-bold bg-sky-500 text-white shadow' : 'px-2 py-1 rounded font-bold hover:bg-slate-600 text-slate-300';
            document.getElementById('btn-label-doremi').className = mode === 'doremi' ? 'px-2 py-1 rounded font-bold bg-sky-500 text-white shadow' : 'px-2 py-1 rounded font-bold hover:bg-slate-600 text-slate-300';

            renderKeyboard();
            highlightCurrentSongGuide();
        }

        function setBodyColor(color) {
            const shell = document.getElementById('pianica-shell');
            shell.classList.remove('bg-sky-400', 'bg-pink-400', 'bg-amber-300', 'bg-emerald-400');

            if (color === 'sky') shell.classList.add('bg-sky-400');
            else if (color === 'pink') shell.classList.add('bg-pink-400');
            else if (color === 'yellow') shell.classList.add('bg-amber-300');
            else if (color === 'green') shell.classList.add('bg-emerald-400');
        }

        /* -------------------------------------------------------------
           LESSON & SONG GUIDE SYSTEM
           ------------------------------------------------------------- */
        function loadSelectedSong() {
            const songKey = document.getElementById('song-select').value;
            if (!songKey || !SONGS[songKey]) {
                currentSong = null;
                songStep = 0;
                document.getElementById('guide-info').innerText = '曲を選んで練習しよう';
                document.getElementById('btn-prev-step').disabled = true;
                document.getElementById('btn-next-step').disabled = true;
                document.getElementById('btn-auto-play').disabled = true;
                clearGuideHighlights();
                return;
            }

            currentSong = SONGS[songKey];
            songStep = 0;
            document.getElementById('btn-prev-step').disabled = false;
            document.getElementById('btn-next-step').disabled = false;
            document.getElementById('btn-auto-play').disabled = false;

            updateSongGuideUI();
        }

        function updateSongGuideUI() {
            if (!currentSong) return;

            const currentMidi = currentSong.notes[songStep];
            const keyConfig = KEYS_CONFIG.find(k => k.midi === currentMidi);
            
            const songTitle = currentSong.title;
            const noteText = keyConfig ? keyConfig.doremi : '';
            const progress = `(${songStep + 1} / ${currentSong.notes.length})`;

            document.getElementById('guide-info').innerText = `${songTitle}: つぎは「 ${noteText} 」 ${progress}`;

            highlightCurrentSongGuide();
        }

        function highlightCurrentSongGuide() {
            clearGuideHighlights();
            if (!currentSong) return;

            const targetMidi = currentSong.notes[songStep];
            const targetKey = document.getElementById(`key-${targetMidi}`);
            if (targetKey) {
                targetKey.classList.add('guide-active');
                targetKey.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function clearGuideHighlights() {
            document.querySelectorAll('.guide-active').forEach(el => el.classList.remove('guide-active'));
        }

        function checkLessonProgress(pressedMidi) {
            if (!currentSong) return;

            const expectedMidi = currentSong.notes[songStep];
            if (pressedMidi === expectedMidi) {
                if (songStep < currentSong.notes.length - 1) {
                    songStep++;
                    updateSongGuideUI();
                } else {
                    document.getElementById('guide-info').innerText = `🎉 祝！ ${currentSong.title} 演奏完了！`;
                    clearGuideHighlights();
                }
            }
        }

        function nextSongStep() {
            if (!currentSong) return;
            if (songStep < currentSong.notes.length - 1) {
                songStep++;
                updateSongGuideUI();
            }
        }

        function prevSongStep() {
            if (!currentSong) return;
            if (songStep > 0) {
                songStep--;
                updateSongGuideUI();
            }
        }

        function toggleAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
                document.getElementById('icon-auto-play').className = 'fa-solid fa-play';
                return;
            }

            if (!currentSong) return;
            songStep = 0;
            document.getElementById('icon-auto-play').className = 'fa-solid fa-stop';

            autoPlayTimer = setInterval(() => {
                if (songStep >= currentSong.notes.length) {
                    clearInterval(autoPlayTimer);
                    autoPlayTimer = null;
                    document.getElementById('icon-auto-play').className = 'fa-solid fa-play';
                    return;
                }

                const midi = currentSong.notes[songStep];
                pressKey(midi);
                setTimeout(() => releaseKey(midi), 300);

                songStep++;
                if (songStep < currentSong.notes.length) {
                    updateSongGuideUI();
                }
            }, 550);
        }

        /* -------------------------------------------------------------
           PC KEYBOARD SHORTCUT EVENT LISTENERS & INITIALIZATION
           ------------------------------------------------------------- */
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            if (PC_KEY_MAP[key]) {
                pcPressedMidis.add(PC_KEY_MAP[key]);
                syncKeyStates();
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (PC_KEY_MAP[key]) {
                pcPressedMidis.delete(PC_KEY_MAP[key]);
                syncKeyStates();
            }
        });

        window.addEventListener('resize', () => {
            renderKeyboard();
        });

        window.onload = () => {
            renderKeyboard();

            // Prevent Context Menu, Text Selection, Dragging, and Double-Tap Zoom globally
            document.addEventListener('contextmenu', (e) => e.preventDefault(), false);
            document.addEventListener('selectstart', (e) => e.preventDefault(), false);
            document.addEventListener('dragstart', (e) => e.preventDefault(), false);
            document.addEventListener('dblclick', (e) => e.preventDefault(), false);

            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, { passive: false });
        };
    </script>
</body>
</html>
