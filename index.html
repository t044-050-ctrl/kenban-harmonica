    <style>
        /* Disable text selection, callout menus, and long-press effects globally */
        *, *::before, *::after {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -khtml-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: none;
            overflow: hidden;
            background-color: #020617;
        }

        /* 16:9 Aspect Ratio Main Container */
        .app-16-9-container {
            aspect-ratio: 16 / 9;
            width: 100vw;
            height: 56.25vw; /* 100 * 9 / 16 */
            max-height: 100vh;
            max-width: 177.78vh; /* 100 * 16 / 9 */
            margin: auto;
        }

        /* Pianica Main Shell 3D styling */
        .pianica-body {
            box-shadow: 
                0 20px 30px rgba(0,0,0,0.4),
                inset 0 2px 4px rgba(255,255,255,0.6);
            transition: background-color 0.3s ease;
        }

        /* Keyboard bed indentation */
        .keyboard-bed {
            box-shadow: 
                inset 0 6px 12px rgba(0, 0, 0, 0.6);
        }

        /* 3D White Key */
        .white-key {
            background: linear-gradient(to bottom, #ffffff 0%, #f3f3f3 75%, #e0e0e0 100%);
            border-radius: 0 0 8px 8px;
            box-shadow: 
                -1px 0 2px rgba(0,0,0,0.1),
                1px 0 2px rgba(0,0,0,0.1),
                0 4px 0 #b5b5b5,
                0 8px 10px rgba(0,0,0,0.3);
            transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.05s ease;
            transform-origin: top center;
        }

        .white-key:active, .white-key.active {
            background: linear-gradient(to bottom, #eeeeee 0%, #e0e0e0 75%, #d5d5d5 100%);
            transform: perspective(500px) rotateX(-2deg) translateY(4px);
            box-shadow: 
                -1px 0 1px rgba(0,0,0,0.1),
                1px 0 1px rgba(0,0,0,0.1),
                0 1px 0 #999999,
                0 2px 4px rgba(0,0,0,0.2);
        }

        /* 3D Black Key */
        .black-key {
            background: linear-gradient(to bottom, #333333 0%, #111111 70%, #222222 100%);
            border-radius: 0 0 4px 4px;
            box-shadow: 
                -2px 0 4px rgba(0,0,0,0.4),
                2px 0 4px rgba(0,0,0,0.4),
                0 5px 0 #000000,
                0 8px 10px rgba(0,0,0,0.5);
            transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.05s ease;
            transform-origin: top center;
            z-index: 20;
        }

        .black-key:active, .black-key.active {
            background: linear-gradient(to bottom, #222222 0%, #050505 100%);
            transform: perspective(500px) rotateX(-2deg) translateY(3px);
            box-shadow: 
                -1px 0 2px rgba(0,0,0,0.4),
                1px 0 2px rgba(0,0,0,0.4),
                0 2px 0 #000000,
                0 3px 5px rgba(0,0,0,0.4);
        }

        /* Hose / Blow Pipe Simulation */
        .blow-pipe {
            background: repeating-linear-gradient(
                90deg,
                #e8e8e8,
                #e8e8e8 6px,
                #cccccc 6px,
                #cccccc 12px
            );
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Custom scrollbar for key bed */
        .keyboard-scroll-container::-webkit-scrollbar {
            height: 10px;
        }
        .keyboard-scroll-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .keyboard-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.4);
            border-radius: 5px;
        }

        /* Note bubble particle effect */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
        }
        .note-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            font-weight: bold;
            z-index: 50;
        }

    <script>
        /* -------------------------------------------------------------
           WEB AUDIO API SYNTHESIZER FOR MELODICA (REED SOUND)
           ------------------------------------------------------------- */
        class MelodicaAudioEngine {
            constructor() {
                this.ctx = null;
                this.activeNotes = new Map();
                this.masterGain = null;
                this.compressor = null;
                this.masterFilter = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    // 超低遅延インタラクティブモード指定
                    this.ctx = new AudioContext({ latencyHint: 'interactive' });

                    // 複数音（和音）同時発音時の音割れ・消音を防ぐマスターコンプレッサー
                    this.masterGain = this.ctx.createGain();
                    const initGain = typeof currentGainValue !== 'undefined' ? currentGainValue : 0.6;
                    this.masterGain.gain.setValueAtTime(initGain, this.ctx.currentTime);

                    // マスターローパスフィルター（明瞭な音色を活かしつつ極端な高音ノイズのみカット）
                    this.masterFilter = this.ctx.createBiquadFilter();
                    this.masterFilter.type = 'lowpass';
                    this.masterFilter.frequency.setValueAtTime(4800, this.ctx.currentTime);
                    this.masterFilter.Q.setValueAtTime(1.0, this.ctx.currentTime);

                    this.compressor = this.ctx.createDynamicsCompressor();
                    this.compressor.threshold.setValueAtTime(-14, this.ctx.currentTime);
                    this.compressor.knee.setValueAtTime(18, this.ctx.currentTime);
                    this.compressor.ratio.setValueAtTime(6, this.ctx.currentTime);
                    this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
                    this.compressor.release.setValueAtTime(0.12, this.ctx.currentTime);

                    this.masterGain.connect(this.masterFilter);
                    this.masterFilter.connect(this.compressor);
                    this.compressor.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            setMasterVolume(val) {
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setValueAtTime(val, this.ctx.currentTime);
                }
            }

            midiToFreq(midi) {
                return 440 * Math.pow(2, (midi - 69) / 12);
            }

            startNote(midi) {
                this.init();
                const now = this.ctx.currentTime;

                // 既に再生中・消音処理中の同音があれば安全にクリーンアップして再発音
                if (this.activeNotes.has(midi)) {
                    const existing = this.activeNotes.get(midi);
                    if (existing.stopTimer) clearTimeout(existing.stopTimer);
                    try {
                        existing.osc1.stop();
                        existing.osc2.stop();
                    } catch(e){}
                    this.activeNotes.delete(midi);
                }

                const freq = this.midiToFreq(midi);

                // 本物の鍵盤ハーモニカらしい明瞭で歯切れの良いリード音（スクエア波 ＋ のこぎり波）
                const osc1 = this.ctx.createOscillator();
                osc1.type = 'square';
                osc1.frequency.setValueAtTime(freq, now);

                const osc2Obj = this.ctx.createOscillator();
                osc2Obj.type = 'sawtooth';
                osc2Obj.frequency.setValueAtTime(freq, now);

                const osc2Gain = this.ctx.createGain();
                osc2Gain.gain.setValueAtTime(0.3, now);

                osc2Obj.connect(osc2Gain);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(Math.min(freq * 3.5, 4200), now);
                filter.Q.setValueAtTime(1.0, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.18, now + 0.005);

                osc1.connect(filter);
                osc2Gain.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterGain || this.ctx.destination);

                osc1.start(now);
                osc2Obj.start(now);

                this.activeNotes.set(midi, { osc1, osc2: osc2Obj, gain, filter, startTime: now });
            }

            stopNote(midi) {
                if (!this.ctx || !this.activeNotes.has(midi)) return;

                const note = this.activeNotes.get(midi);
                const now = this.ctx.currentTime;

                const minDuration = 0.05; 
                const elapsedTime = now - note.startTime;
                const releaseStartTime = elapsedTime < minDuration ? note.startTime + minDuration : now;
                const releaseDuration = 0.08;

                try {
                    note.gain.gain.cancelScheduledValues(now);
                    note.gain.gain.setValueAtTime(note.gain.gain.value || 0.18, now);
                    note.gain.gain.linearRampToValueAtTime(0.0001, releaseStartTime + releaseDuration);
                } catch (e) {}

                const delayMs = Math.max(10, Math.round((releaseStartTime + releaseDuration - now) * 1000) + 10);

                note.stopTimer = setTimeout(() => {
                    try {
                        note.osc1.stop();
                        note.osc2.stop();
                        note.osc1.disconnect();
                        note.osc2.disconnect();
                        note.gain.disconnect();
                    } catch (e) {}
                    if (this.activeNotes.get(midi) === note) {
                        this.activeNotes.delete(midi);
                    }
                }, delayMs);
            }
        }

        const audioEngine = new MelodicaAudioEngine();

        // 最初の画面タップ/操作イベントのキャプチャ段階で音声エンジンを即時起動
        const unlockAudioContext = () => {
            audioEngine.init();
        };
        window.addEventListener('pointerdown', unlockAudioContext, { capture: true });
        window.addEventListener('touchstart', unlockAudioContext, { capture: true });
        window.addEventListener('mousedown', unlockAudioContext, { capture: true });
        window.addEventListener('keydown', unlockAudioContext, { capture: true });

        // iOS/Androidでのマルチジェスチャー（ピンチズーム・拡大処理）の介入による音声強制キャンセルを防止
        window.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

        // 全画面での長押しコンテキストメニュー表示を完全に防ぐ
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        }, { passive: false });

        // ダブルタップによるズーム・範囲選択・メニュー表示を防止
        let lastTouchEnd = 0;
        window.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                // テキスト入力欄以外でのダブルタップ標準動作をキャンセル
                if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                }
            }
            lastTouchEnd = now;
        }, { passive: false });

        /* -------------------------------------------------------------
           CONSTANTS & DATA STRUCTURES
           ------------------------------------------------------------- */
        const KEYS_CONFIG = [
            { midi: 53, isBlack: false, whitePos: 0, doremi: "ファ", cde: "F3" },
            { midi: 54, isBlack: true,  whitePos: 0, doremi: "ファ#", cde: "F#3" },
            { midi: 55, isBlack: false, whitePos: 1, doremi: "ソ", cde: "G3" },
            { midi: 56, isBlack: true,  whitePos: 1, doremi: "ソ#", cde: "G#3" },
            { midi: 57, isBlack: false, whitePos: 2, doremi: "ラ", cde: "A3" },
            { midi: 58, isBlack: true,  whitePos: 2, doremi: "ラ#", cde: "A#3" },
            { midi: 59, isBlack: false, whitePos: 3, doremi: "シ", cde: "B3" },
            { midi: 60, isBlack: false, whitePos: 4, doremi: "ド", cde: "C4" },
            { midi: 61, isBlack: true,  whitePos: 4, doremi: "ド#", cde: "C#4" },
            { midi: 62, isBlack: false, whitePos: 5, doremi: "レ", cde: "D4" },
            { midi: 63, isBlack: true,  whitePos: 5, doremi: "レ#", cde: "D#4" },
            { midi: 64, isBlack: false, whitePos: 6, doremi: "ミ", cde: "E4" },
            { midi: 65, isBlack: false, whitePos: 7, doremi: "ファ", cde: "F4" },
            { midi: 66, isBlack: true,  whitePos: 7, doremi: "ファ#", cde: "F#4" },
            { midi: 67, isBlack: false, whitePos: 8, doremi: "ソ", cde: "G4" },
            { midi: 68, isBlack: true,  whitePos: 8, doremi: "ソ#", cde: "G#4" },
            { midi: 69, isBlack: false, whitePos: 9, doremi: "ラ", cde: "A4" },
            { midi: 70, isBlack: true,  whitePos: 9, doremi: "ラ#", cde: "A#4" },
            { midi: 71, isBlack: false, whitePos: 10, doremi: "シ", cde: "B4" },
            { midi: 72, isBlack: false, whitePos: 11, doremi: "ド", cde: "C5" },
            { midi: 73, isBlack: true,  whitePos: 11, doremi: "ド#", cde: "C#5" },
            { midi: 74, isBlack: false, whitePos: 12, doremi: "レ", cde: "D5" },

        // 鍵盤の画面上での座標情報をあらかじめ高速ロードして保持するキャッシュ関数

            for (const midi of Array.from(activePressedMidis)) {

            targetMidis.forEach(midi => {

        let lastScrollLockToggleTime = 0;
        function toggleScrollLock(e) {
            if (e) {
                e.stopPropagation();
            }
            // タップとクリックの二重発動を防止
            const now = Date.now();
            if (now - lastScrollLockToggleTime < 250) return;
            lastScrollLockToggleTime = now;

            const wrapper = document.getElementById('keyboard-wrapper');
            const currentScroll = wrapper ? wrapper.scrollLeft : 0;

            isScrollLocked = !isScrollLocked;
            updateScrollLockUI();

            if (wrapper) {
                if (isScrollLocked) {
                    wrapper.classList.remove('overflow-x-auto');
                    wrapper.classList.add('overflow-x-hidden');
                } else {
                    wrapper.classList.remove('overflow-x-hidden');
                    wrapper.classList.add('overflow-x-auto');

                // 移動させた現在のスクロール位置を維持してロック
                wrapper.scrollLeft = currentScroll;

        function setScaleMode(isMm) {
            const wasFit = !isRealMmScale;
            isRealMmScale = isMm;

        /* タッチ座標から最も適切な鍵盤を確実に算出するスマート判定関数 */
        function getKeyFromPoint(x, y) {
            const el = document.elementFromPoint(x, y);
            if (el) {
                const keyEl = el.closest('[data-midi]');
                if (keyEl) return parseInt(keyEl.dataset.midi, 10);
            }

            // キャッシュした位置情報を使ってDOM再計算（リフロー）を起こさずに超高速判定
            if (!cachedKeyRects || cachedKeyRects.length === 0) {
                updateKeyRectsCache();
            }

            // 1. 黒鍵を優先チェック
            for (let i = 0; i < cachedKeyRects.length; i++) {
                const item = cachedKeyRects[i];
                if (item.isBlack && x >= item.left && x <= item.right && y >= item.top && y <= item.bottom) {
                    return item.midi;
                }
            }

            // 2. 最も近い白鍵を判定
            let bestMidi = null;
            let minDistance = Infinity;
            for (let i = 0; i < cachedKeyRects.length; i++) {
                const item = cachedKeyRects[i];
                if (item.isWhite) {
                    if (x >= item.left && x <= item.right && y >= item.top && y <= item.bottom) {
                        return item.midi;
                    }
                    if (y >= item.top && y <= item.bottom) {
                        const dist = Math.abs(x - item.centerX);
                        if (dist < minDistance) {
                            minDistance = dist;
                            bestMidi = item.midi;
                        }
                    }
                }
            }
            return bestMidi;
        }

        let touchListenersInitialized = false;
        const touchIdToMidiMap = new Map();

        function setupPointerListeners(container) {
            const wrapper = document.getElementById('keyboard-wrapper') || container;
            if (wrapper) {
                wrapper.addEventListener('scroll', updateKeyRectsCache, { passive: true });
            }

            if (touchListenersInitialized) return;
            touchListenersInitialized = true;

            // 位置ロック解除時の指・マウスドラッグ移動制御用
            let touchStartX = 0;
            let touchStartScrollLeft = 0;
            let isTouchSwiping = false;

            let isMouseDragging = false;
            let mouseStartX = 0;
            let mouseStartScrollLeft = 0;

            // マルチタッチ（複数指同時押し・長押し完全対応＆隙間不感帯問題の解消）
            const handleTouch = (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                const isKeybed = e.target.closest('#keyboard-container') || e.target.closest('#keyboard-wrapper') || e.target.closest('.pianica-body');
                if (isKeybed || e.touches.length > 0) {
                    if (e.cancelable) e.preventDefault();
                }
                audioEngine.init();

                const currentWrapper = document.getElementById('keyboard-wrapper') || wrapper;

                // 位置ロック解除時 (isScrollLocked === false) の指による左右スワイプ移動
                if (!isScrollLocked) {
                    if (e.type === 'touchstart' && e.touches.length === 1) {
                        touchStartX = e.touches[0].clientX;
                        touchStartScrollLeft = currentWrapper.scrollLeft;
                        isTouchSwiping = true;
                    } else if (e.type === 'touchmove' && isTouchSwiping && e.touches.length === 1) {
                        const deltaX = e.touches[0].clientX - touchStartX;
                        currentWrapper.scrollLeft = touchStartScrollLeft - deltaX;
                    }
                }
                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    if (e.touches.length === 0) {
                        isTouchSwiping = false;
                    }
                }

                const activeTouchIds = new Set();
                const touchMidis = new Set();
                const isMultiTouch = e.touches.length > 1;

                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    activeTouchIds.add(touch.identifier);

                    let assignedMidi = null;
                    const newMidi = getKeyFromPoint(touch.clientX, touch.clientY);

                    if (touchIdToMidiMap.has(touch.identifier)) {
                        const currentMidi = touchIdToMidiMap.get(touch.identifier);
                        if (isMultiTouch) {
                            // 和音（2本以上の指）長押し時は、指先の微振動で音が消えないよう最初の音階を完全に固定保持
                            assignedMidi = currentMidi;
                        } else {
                            // 単音演奏時のみスライド移動を許可
                            assignedMidi = (newMidi !== null) ? newMidi : currentMidi;
                        }
                    } else {
                        assignedMidi = newMidi;
                    }

                    if (assignedMidi !== null) {
                        touchIdToMidiMap.set(touch.identifier, assignedMidi);
                        touchMidis.add(assignedMidi);
                    }
                }

                // 画面から離れたタッチIDのみマップから削除
                for (const [id] of touchIdToMidiMap) {
                    if (!activeTouchIds.has(id)) {
                        touchIdToMidiMap.delete(id);
                    }
                }

                activeTouchMidis = touchMidis;
                syncKeyStates();
            };

            window.addEventListener('touchstart', handleTouch, { passive: false });
            window.addEventListener('touchmove', handleTouch, { passive: false });
            window.addEventListener('touchend', handleTouch, { passive: false });
            window.addEventListener('touchcancel', handleTouch, { passive: false });

            // マウスドラッグによる鍵盤移動制御（ロック解除時）
            container.addEventListener('mousedown', (e) => {
                if (!isScrollLocked) {
                    isMouseDragging = true;
                    mouseStartX = e.clientX;
                    mouseStartScrollLeft = wrapper.scrollLeft;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!isScrollLocked && isMouseDragging) {
                    const deltaX = e.clientX - mouseStartX;
                    wrapper.scrollLeft = mouseStartScrollLeft - deltaX;
                }
            });

            window.addEventListener('mouseup', () => {
                isMouseDragging = false;
            });

            // ポインターイベント（マウス / ペン用）
            const updatePointerFromEvent = (e) => {
                if (e.pointerType === 'touch') return; // タッチは専用ハンドラーで一括処理
                const el = document.elementFromPoint(e.clientX, e.clientY);
                const keyEl = el ? el.closest('[data-midi]') : null;
                if (keyEl) {
                    const midi = parseInt(keyEl.dataset.midi, 10);
                    const isWhiteKey = keyEl.classList.contains('white-key');

                    if (isWhiteKey) {
                        const rect = keyEl.getBoundingClientRect();
                        const deadZonePx = rect.width * (1.0 / 26.6);
                        const relX = e.clientX - rect.left;
                        if (relX >= deadZonePx && relX <= (rect.width - deadZonePx)) {
                            activePointerMidis.set(e.pointerId, midi);
                        } else {
                            activePointerMidis.delete(e.pointerId);
                        }
                    } else {
                        activePointerMidis.set(e.pointerId, midi);
                    }
                } else {
                    activePointerMidis.delete(e.pointerId);
                }
                syncKeyStates();
            };

            container.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return;
                e.preventDefault();
                audioEngine.init();
                updatePointerFromEvent(e);
            });

            window.addEventListener('pointermove', (e) => {
                if (e.pointerType === 'touch') return;
                if (e.buttons > 0) {
                    updatePointerFromEvent(e);
                }
            });

            const clearPointer = (e) => {
                if (activePointerMidis.has(e.pointerId)) {
                    activePointerMidis.delete(e.pointerId);
                    syncKeyStates();
                }
            };

            window.addEventListener('pointerup', clearPointer);
            window.addEventListener('pointercancel', clearPointer);
            window.addEventListener('pointerleave', clearPointer);
            
            // タブ非表示時（ページ離脱時）のみ音を完全停止
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) stopAllNotes();
            });
        }

        function getLabelText(key) {
            if (labelMode === 'doremi') return key.doremi;
            return '';
        }

        /* -------------------------------------------------------------
           KEY PRESS / RELEASE ACTIONS
           ------------------------------------------------------------- */
        function pressKey(midi) {
            if (activePressedMidis.has(midi)) return;
            activePressedMidis.add(midi);

            const keyEl = document.getElementById(`key-${midi}`);
            if (keyEl) keyEl.classList.add('active');

            audioEngine.startNote(midi);
            createNoteParticle(midi);
        }

        function releaseKey(midi) {
            if (!activePressedMidis.has(midi)) return;
            activePressedMidis.delete(midi);

            const keyEl = document.getElementById(`key-${midi}`);
            if (keyEl) keyEl.classList.remove('active');

            audioEngine.stopNote(midi);
        }

        function createNoteParticle(midi) {
            const keyEl = document.getElementById(`key-${midi}`);
            if (!keyEl) return;

            const rect = keyEl.getBoundingClientRect();
            const particle = document.createElement('div');
            particle.className = 'note-particle text-amber-400 font-black text-sm drop-shadow-md';
            particle.innerText = '♪';
            particle.style.left = `${rect.left + rect.width / 2 - 8}px`;
            particle.style.top = `${rect.top - 10}px`;

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 800);
        }

        /* -------------------------------------------------------------
           LABEL & THEME CONTROLS
           ------------------------------------------------------------- */
        function setLabelMode(mode) {
            labelMode = mode;
            document.getElementById('btn-label-none').className = mode === 'none' ? 'px-2 py-1 rounded font-bold bg-sky-500 text-white shadow' : 'px-2 py-1 rounded font-bold hover:bg-slate-600 text-slate-300';
            document.getElementById('btn-label-doremi').className = mode === 'doremi' ? 'px-2 py-1 rounded font-bold bg-sky-500 text-white shadow' : 'px-2 py-1 rounded font-bold hover:bg-slate-600 text-slate-300';

            renderKeyboard();
        }

        function setBodyColor(color) {
            const shell = document.getElementById('pianica-shell');
            shell.classList.remove('bg-sky-400', 'bg-pink-400', 'bg-amber-300', 'bg-emerald-400');

            if (color === 'sky') shell.classList.add('bg-sky-400');
            else if (color === 'pink') shell.classList.add('bg-pink-400');
            else if (color === 'yellow') shell.classList.add('bg-amber-300');
            else if (color === 'green') shell.classList.add('bg-emerald-400');
        }

        /* -------------------------------------------------------------
           VOLUME CONTROLS (0-5 STAGES & MUTE TOGGLE)
           ------------------------------------------------------------- */
        function setVolumeLevel(val) {
            const level = parseInt(val, 10);
            currentVolLevel = level;

            if (level > 0) {
                lastVolLevel = level;
            }

            currentGainValue = level / 5;
            audioEngine.setMasterVolume(currentGainValue);

            // スライダーの位置を同期
            const slider = document.getElementById('volume-slider');
            if (slider) slider.value = level;

            // 0〜5数字ボタンのハイライト表示切り替え
            const stepBtns = document.querySelectorAll('.vol-step-btn');
            stepBtns.forEach(btn => {
                const btnVol = parseInt(btn.dataset.vol, 10);
                if (btnVol === level) {
                    btn.className = 'vol-step-btn font-black text-amber-400 scale-110 transition-all cursor-pointer';
                } else {
                    btn.className = 'vol-step-btn font-medium text-slate-400 hover:text-slate-200 transition-all cursor-pointer';
                }
            });

            // 消音ボタンの見た目・アイコン切り替え
            const muteBtn = document.getElementById('btn-mute');
            const muteIcon = document.getElementById('mute-icon');
            if (muteBtn && muteIcon) {
                if (level === 0) {
                    muteBtn.className = 'w-8 h-8 rounded-lg font-bold bg-rose-600 hover:bg-rose-500 text-white transition-all flex items-center justify-center border border-rose-400 shadow-sm active:scale-95';
                    muteIcon.className = 'fa-solid fa-volume-xmark text-white text-base';
                } else {
                    muteBtn.className = 'w-8 h-8 rounded-lg font-bold bg-slate-600 hover:bg-slate-500 text-slate-200 transition-all flex items-center justify-center border border-slate-500 shadow-sm active:scale-95';
                    muteIcon.className = level < 3 
                        ? 'fa-solid fa-volume-low text-amber-400 text-base'
                        : 'fa-solid fa-volume-high text-amber-400 text-base';
                }
            }
        }

        function toggleMute() {
            if (currentVolLevel > 0) {
                lastVolLevel = currentVolLevel;
                setVolumeLevel(0);
            } else {
                setVolumeLevel(lastVolLevel > 0 ? lastVolLevel : 3);
            }
        }

        window.addEventListener('resize', () => {
            renderKeyboard();
            updateKeyRectsCache();
        });

        /* -------------------------------------------------------------
           INITIALIZATION ON WINDOW LOAD
           ------------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', () => {
            renderKeyboard();
            updateScrollLockUI();
            setVolumeLevel(3); // 初期音量レベル3を適用
            updateKeyRectsCache();
        });
    </script>
</body>
</html>
